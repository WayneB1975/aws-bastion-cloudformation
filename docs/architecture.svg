<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16232E"/>
    </marker>
    <marker id="arrowSsh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B3402C"/>
    </marker>
    <marker id="arrowIcmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="800" fill="#F7F9FA"/>

  <!-- Internet -->
  <text x="550" y="46" text-anchor="middle" font-size="15" fill="#6B7680">Internet</text>
  <line x1="550" y1="58" x2="550" y2="84" stroke="#16232E" stroke-width="1.6" marker-end="url(#arrowInk)"/>

  <!-- Internet gateway -->
  <rect x="470" y="90" width="160" height="44" rx="4" fill="#FFFFFF" stroke="#16232E" stroke-width="1.6"/>
  <text x="550" y="118" text-anchor="middle" font-size="14" fill="#16232E">Internet gateway</text>

  <!-- VPC boundary -->
  <rect x="70" y="175" width="960" height="500" rx="8" fill="none" stroke="#2D4356" stroke-width="2"/>
  <text x="90" y="203" font-size="14" font-weight="600" fill="#2D4356">VPC</text>
  <text x="132" y="203" font-size="13" fill="#6B7680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.0.0/16</text>

  <!-- AZ headers -->
  <text x="110" y="238" font-size="13" font-weight="600" fill="#6B7680">Availability Zone A</text>
  <text x="580" y="238" font-size="13" font-weight="600" fill="#6B7680">Availability Zone B</text>

  <!-- Public subnets -->
  <rect x="110" y="255" width="410" height="110" rx="5" fill="#FDF2E0" stroke="#D98E2B" stroke-width="1.5"/>
  <text x="128" y="278" font-size="13" font-weight="600" fill="#8A5A12">Public subnet 1A</text>
  <text x="128" y="296" font-size="12.5" fill="#8A5A12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.1.0/24</text>
  <text x="128" y="330" font-size="12.5" fill="#B08A4E" font-style="italic">no instance deployed</text>

  <rect x="580" y="255" width="410" height="110" rx="5" fill="#FDF2E0" stroke="#D98E2B" stroke-width="1.5"/>
  <text x="598" y="278" font-size="13" font-weight="600" fill="#8A5A12">Public subnet 2B</text>
  <text x="598" y="296" font-size="12.5" fill="#8A5A12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.4.0/24</text>

  <rect x="685" y="303" width="200" height="46" rx="4" fill="#FFFFFF" stroke="#16232E" stroke-width="1.6"/>
  <text x="785" y="321" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16232E">Bastion host</text>
  <text x="785" y="338" text-anchor="middle" font-size="12" fill="#6B7680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.4.220</text>

  <!-- App private subnets -->
  <rect x="110" y="395" width="410" height="110" rx="5" fill="#EAF1F7" stroke="#3E7CB1" stroke-width="1.5"/>
  <text x="128" y="418" font-size="13" font-weight="600" fill="#22557F">App private subnet 1A</text>
  <text x="128" y="436" font-size="12.5" fill="#22557F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.2.0/24</text>

  <rect x="215" y="445" width="200" height="46" rx="4" fill="#FFFFFF" stroke="#16232E" stroke-width="1.6"/>
  <text x="315" y="463" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16232E">App1</text>
  <text x="315" y="480" text-anchor="middle" font-size="12" fill="#6B7680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.2.163</text>

  <rect x="580" y="395" width="410" height="110" rx="5" fill="#EAF1F7" stroke="#3E7CB1" stroke-width="1.5"/>
  <text x="598" y="418" font-size="13" font-weight="600" fill="#22557F">App private subnet 2B</text>
  <text x="598" y="436" font-size="12.5" fill="#22557F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.5.0/24</text>

  <rect x="685" y="445" width="200" height="46" rx="4" fill="#FFFFFF" stroke="#16232E" stroke-width="1.6"/>
  <text x="785" y="463" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16232E">App2</text>
  <text x="785" y="480" text-anchor="middle" font-size="12" fill="#6B7680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.5.216</text>

  <!-- Data private subnets -->
  <rect x="110" y="535" width="410" height="110" rx="5" fill="#F0F1F3" stroke="#A8B0B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="128" y="558" font-size="13" font-weight="600" fill="#6B7680">Data private subnet 1A</text>
  <text x="128" y="576" font-size="12.5" fill="#6B7680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.3.0/24</text>
  <text x="128" y="606" font-size="12.5" fill="#8A929B" font-style="italic">reserved for a future data tier</text>

  <rect x="580" y="535" width="410" height="110" rx="5" fill="#F0F1F3" stroke="#A8B0B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="598" y="558" font-size="13" font-weight="600" fill="#6B7680">Data private subnet 2B</text>
  <text x="598" y="576" font-size="12.5" fill="#6B7680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">172.16.6.0/24</text>
  <text x="598" y="606" font-size="12.5" fill="#8A929B" font-style="italic">reserved for a future data tier</text>

  <!-- Traffic: internet gateway to bastion -->
  <path d="M 550 134 L 550 326 L 679 326" fill="none" stroke="#B3402C" stroke-width="2" marker-end="url(#arrowSsh)"/>
  <rect x="506" y="198" width="88" height="22" rx="11" fill="#F7F9FA" stroke="#B3402C" stroke-width="1.2"/>
  <text x="550" y="213" text-anchor="middle" font-size="12" fill="#B3402C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SSH :22</text>

  <!-- Traffic: bastion to App1 -->
  <path d="M 785 349 L 785 378 L 315 378 L 315 441" fill="none" stroke="#B3402C" stroke-width="2" marker-end="url(#arrowSsh)"/>
  <rect x="506" y="369" width="88" height="22" rx="11" fill="#F7F9FA" stroke="#B3402C" stroke-width="1.2"/>
  <text x="550" y="384" text-anchor="middle" font-size="12" fill="#B3402C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SSH :22</text>

  <!-- Traffic: App1 to App2 -->
  <path d="M 415 468 L 679 468" fill="none" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowIcmp)"/>
  <rect x="512" y="457" width="76" height="22" rx="11" fill="#F7F9FA" stroke="#2E7D4F" stroke-width="1.2"/>
  <text x="550" y="472" text-anchor="middle" font-size="12" fill="#2E7D4F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ICMP</text>

  <!-- Legend -->
  <rect x="70" y="700" width="15" height="15" rx="2" fill="#FDF2E0" stroke="#D98E2B" stroke-width="1.5"/>
  <text x="93" y="712" font-size="12.5" fill="#16232E">Public subnet</text>

  <rect x="200" y="700" width="15" height="15" rx="2" fill="#EAF1F7" stroke="#3E7CB1" stroke-width="1.5"/>
  <text x="223" y="712" font-size="12.5" fill="#16232E">Private subnet</text>

  <rect x="335" y="700" width="15" height="15" rx="2" fill="#F0F1F3" stroke="#A8B0B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="358" y="712" font-size="12.5" fill="#16232E">Reserved, not deployed</text>

  <line x1="530" y1="707" x2="558" y2="707" stroke="#B3402C" stroke-width="2"/>
  <text x="566" y="712" font-size="12.5" fill="#16232E">SSH</text>

  <line x1="615" y1="707" x2="643" y2="707" stroke="#2E7D4F" stroke-width="2"/>
  <text x="651" y="712" font-size="12.5" fill="#16232E">ICMP</text>

  <text x="70" y="748" font-size="12.5" fill="#6B7680">No NAT gateway and no internet gateway route on the private subnets — the app instances have no inbound or outbound internet path.</text>
  <text x="70" y="768" font-size="12.5" fill="#6B7680">Security group rules reference other security groups as their source, not CIDR blocks. App2 has no key pair and no SSH ingress by design.</text>

</svg>
