AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ VPC with a bastion host in a public subnet and two application
  instances in private subnets. 2 public and 4 private subnets across 2 AZs.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  MyIpCidr:
    Type: String
    Description: >
      Your public IP in CIDR form, e.g. 203.0.113.10/32. Get it from
      whatismyipaddress.com. Never commit a real value as a default.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block, e.g. 203.0.113.10/32

  KeyPairName:
    Type: 'AWS::EC2::KeyPair::KeyName'
    Description: Name of an existing EC2 key pair for SSH access.
    Default: Bastion

  InstanceType:
    Type: String
    Description: EC2 instance type for the bastion and app servers.
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro, t3.small]

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Description: >
      Resolves to the current Amazon Linux 2023 AMI in whatever region the
      stack is deployed to. Do not hardcode AMI IDs.
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # --- Network foundation --------------------------------------------------

  MyVPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: '172.16.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: MyVPC

  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: MyVPC-IGW

  AttachGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  # --- Subnets, AZ 1 -------------------------------------------------------

  PublicSubnet1A:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.1.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PublicSubnet1A

  AppPrivateSubnet1A:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.2.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: AppPrivateSubnet1A

  DataPrivateSubnet1A:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.3.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: DataPrivateSubnet1A

  # --- Subnets, AZ 2 -------------------------------------------------------

  PublicSubnet2B:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.4.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PublicSubnet2B

  AppPrivateSubnet2B:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.5.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: AppPrivateSubnet2B

  DataPrivateSubnet2B:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.6.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: DataPrivateSubnet2B

  # --- Routing -------------------------------------------------------------
  # Private subnets are intentionally left with no route table association.
  # They fall through to the VPC main route table, which is local-only, so
  # the app instances have no path to the internet. This is deliberate
  # isolation for this lab. Adding a NAT Gateway (and a private route table)
  # is what you would do to allow outbound package updates or SSM agent
  # registration.

  PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: PublicRouteTable

  PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1ARouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet1A
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2BRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet2B
      RouteTableId: !Ref PublicRouteTable

  # --- Security groups -----------------------------------------------------

  BastionSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'SSH from a single trusted IP'
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
          Description: SSH from operator workstation
      Tags:
        - Key: Name
          Value: BastionSG

  AppInstance1ASG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'SSH from bastion only'
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionSG
          Description: SSH from bastion
      Tags:
        - Key: Name
          Value: AppInstance1ASG

  AppInstance2BSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'ICMP from App1 only - no shell access by design'
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        # ICMP from App1 is the ONLY ingress rule, deliberately.
        # App2 exists to prove east-west connectivity between private
        # subnets across AZs via security group references. It is not an
        # administrative target and has no SSH ingress and no key pair.
        # FromPort/ToPort of -1 means "all ICMP types and codes".
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          SourceSecurityGroupId: !Ref AppInstance1ASG
          Description: ICMP from App1 - east-west reachability test
      Tags:
        - Key: Name
          Value: AppInstance2BSG

  # --- Instances -----------------------------------------------------------

  BastionHost:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet2B
      SecurityGroupIds:
        - !Ref BastionSG
      Tags:
        - Key: Name
          Value: BastionHost

  AppInstance1A:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref AppPrivateSubnet1A
      SecurityGroupIds:
        - !Ref AppInstance1ASG
      Tags:
        - Key: Name
          Value: App1

  AppInstance2B:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: !Ref InstanceType
      # No KeyName by design. App2 is a reachability target, not an
      # administrative host. Omitting the key pair means no shell access
      # is possible even if a security group rule were added later.
      # Note: a key pair can only be assigned at launch, so this is a
      # one-way door - reaching App2 later means replacing the instance.
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref AppPrivateSubnet2B
      SecurityGroupIds:
        - !Ref AppInstance2BSG
      Tags:
        - Key: Name
          Value: App2

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  BastionPublicIp:
    Description: Public IP of the bastion host - SSH to this.
    Value: !GetAtt BastionHost.PublicIp

  BastionSshCommand:
    Description: Copy-paste SSH command for the bastion.
    Value: !Sub 'ssh -i ${KeyPairName}.pem ec2-user@${BastionHost.PublicIp}'

  App1ProxyJumpCommand:
    Description: >
      One-step connection to App1 through the bastion. The private key never
      leaves your workstation.
    Value: !Sub >-
      ssh -i ${KeyPairName}.pem -J ec2-user@${BastionHost.PublicIp}
      ec2-user@${AppInstance1A.PrivateIp}

  App1PrivateIp:
    Description: Private IP of App1.
    Value: !GetAtt AppInstance1A.PrivateIp

  App2PrivateIp:
    Description: Private IP of App2 - ping target from App1.
    Value: !GetAtt AppInstance2B.PrivateIp

  VpcId:
    Description: VPC ID, for reference by other stacks.
    Value: !Ref MyVPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
